<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Kidus Tesfaye</title><link rel="stylesheet" href="styles.css"><script src="registration-config.js" defer></script><script src="register.js" defer></script></head><body><header class="masthead"><a class="brand" href="index.html#home"><span class="brand-mark">&lt;/&gt;</span><span>Kidus Tesfaye<small>TECHNOLOGY ACADEMY</small></span></a></header><main><section class="course-wrap registration"><a class="back" href="index.html#home">← Explore courses</a><p class="eyebrow">INVEST IN YOUR NEXT CHAPTER</p><h1>Register for a course.</h1><p class="intro">Choose your course and payment plan. Payments are processed securely through Stripe.</p><p id="status" role="status"></p><form id="registration"><div class="two-col"><label>Full name<input name="name" autocomplete="name" maxlength="200" required></label><label>Email address<input name="email" type="email" autocomplete="email" maxlength="200" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" maxlength="200" required></label><label>Course<select name="course" id="course" required></select></label></div><label>Preferred schedule<input name="schedule" placeholder="Days and times, including your time zone" maxlength="200" required></label><fieldset><legend>Payment plan — USD</legend><label class="plan-option"><input type="radio" name="plan" value="upfront" checked><span><strong>$1,800 upfront</strong><small>One payment · Save $200 from the $2,000 course price.</small></span></label><label class="plan-option"><input type="radio" name="plan" value="monthly"><span><strong>$500 per month × 4</strong><small>$2,000 total · First payment after authorization, then three monthly payments. Ends automatically after four billing periods.</small></span></label></fieldset><label class="consent"><input type="checkbox" name="consent" required><span>I agree to the selected payment plan and authorize its charges. I consent to using my details for registration and course communication. My preferred schedule is a request; availability will be confirmed separately.</span></label><p class="intro">Review the <a href="registration-policy.html">registration, privacy, and refund information</a> before continuing.</p><button class="primary" id="submit" type="submit">Continue to secure checkout ↗</button></form></section></main></body></html>
